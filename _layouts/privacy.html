<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }}</title>

  <style>
    body {
      margin: 0;
      background: #f5f5f7;
      color: #1d1d1f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.7;
    }

    .container {
      max-width: 800px;
      margin: 60px auto;
      padding: 48px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 30px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 36px;
      margin-bottom: 8px;
    }

    h2 {
      margin-top: 40px;
    }

    a {
      color: #007aff;
    }

    @media (max-width: 600px) {
      .container {
        margin: 0;
        padding: 24px;
        border-radius: 0;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>{{ page.title }}</h1>

    {{ content }}
  </main>
</body>
</html>
